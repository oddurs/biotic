name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - run: corepack enable
      - uses: actions/setup-node@v6
        with:
          node-version-file: web/.node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - name: cache playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/pnpm-lock.yaml') }}
      - run: pnpm --filter @biotic/design exec playwright install chromium --with-deps
        working-directory: web
      - run: scripts/task check
        env:
          TASK_SCOPE: all

  # The single status check branch protection requires. A skipped job would count as
  # passing, so this runs always and fails unless every job it needs succeeded.
  required:
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.check.result }}" = "success"
