[project]
name = "biotic"
version = "0.1.0"
description = "An organism that grows its own body, from a seed."
readme = "README.md"
license = "MIT"
authors = [{ name = "Oddur Sigurdsson" }]
requires-python = ">=3.11"
dependencies = ["rich>=13.7"]

[project.urls]
Repository = "https://github.com/oddurs/biotic"
Changelog = "https://github.com/oddurs/biotic/blob/main/CHANGELOG.md"

[project.scripts]
biotic = "bio.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bio"]

[tool.hatch.build.targets.sdist]
only-include = ["bio", "tests", "CHANGELOG.md"]

[tool.ruff]
line-length = 120
target-version = "py311"
# soma/, vessel/, and library specimens hold code the organism wrote for itself; the apparatus is what gets linted.
extend-exclude = ["soma", "vessel", "web/apps/site/src/content/specimens"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
