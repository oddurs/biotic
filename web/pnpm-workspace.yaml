packages:
  - apps/*
  - packages/*

# pnpm refuses to run dependency install scripts unless they are allowed here.
allowBuilds:
  esbuild: true
  sharp: true

# Supply-chain policy: packages must be at least a day old, except the ones we
# deliberately adopt on release day. pnpm appends to this list on install.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - prettier-plugin-astro@1.0.0
  - "@astrojs/markdown-satteri@0.4.1"
  - "@astrojs/mdx@8.0.1"
  - astro@7.3.2

# eslint-plugin-jsx-a11y declares eslint <=9 but runs on 10; the range lags the release.
peerDependencyRules:
  allowedVersions:
    eslint: "10"
